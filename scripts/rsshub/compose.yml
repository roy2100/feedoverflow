services:
  rsshub:
    build: .
    image: feedoverflow-rsshub:v2026.11.21-8713.53e83fa
    container_name: rsshub
    # Upstream npm start replaces NODE_OPTIONS, discarding the heap cap below.
    command: ["node", "--max-http-header-size=32768", "dist/index.mjs"]
    ports:
      - "127.0.0.1:1200:1200"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
      CACHE_TYPE: memory
      CACHE_EXPIRE: "300"
      CACHE_CONTENT_EXPIRE: "300"
      TZ: Asia/Shanghai
    mem_limit: 320m
    memswap_limit: 320m
    restart: unless-stopped
