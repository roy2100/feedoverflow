services:
  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    ports:
      - "127.0.0.1:1200:1200"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
      CACHE_TYPE: memory
      CACHE_EXPIRE: "300"
      CACHE_CONTENT_EXPIRE: "300"
      TZ: Asia/Shanghai
    mem_limit: 320m
    memswap_limit: 320m
    restart: unless-stopped
